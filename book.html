<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurfX | Book Your Slot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'], display: ['Bebas Neue', 'sans-serif'] },
                    colors: { brand: { orange: '#ff5a00', navy: '#0b132b', blue: '#1c2541' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8f9fa; color: #0b132b; }
        .nav-link { position: relative; transition: color 0.3s; }
        .nav-link:hover { color: #ff5a00; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; }
        .day-header { text-align: center; font-size: 0.8rem; color: #6b7280; font-weight: 700; padding-bottom: 0.5rem; }
        .day-cell {
            aspect-ratio: 1; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; font-weight: 700; background: white; border: 2px solid #e5e7eb;
            transform: skewX(-5deg);
        }
        .day-cell span { transform: skewX(5deg); }
        .day-cell:hover:not(.disabled) { border-color: #ff5a00; color: #ff5a00; }
        .day-cell.selected { background: #ff5a00; color: white; border-color: #ff5a00; }
        .day-cell.disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; border-color: transparent; }
        
        .slot-card { transform: skewX(-5deg); transition: transform 0.2s; }
        .slot-card-inner { transform: skewX(5deg); }
        .slot-card:hover:not(.opacity-50) { transform: skewX(-5deg) translateY(-5px); border-color: #ff5a00; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Navigation -->
    <nav class="w-full bg-brand-navy py-6 shadow-xl relative z-20">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="text-4xl font-display text-white tracking-wider">TURF<span class="text-brand-orange">X</span></a>
            <div class="hidden md:flex space-x-8 font-bold text-lg text-white font-display tracking-widest items-center">
                <a href="index.html" class="nav-link">HOME</a>
                <a href="locations.html" class="nav-link">VENUES & 3D</a>
                <a href="book.html" class="text-brand-orange">BOOK PITCH</a>
                <button onclick="openManageModal()" class="border-2 border-brand-orange text-brand-orange px-4 py-1 hover:bg-brand-orange hover:text-white transition-colors transform skew-x-[-10deg]">MANAGE BOOKINGS</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12 flex flex-col lg:flex-row gap-12">
        <!-- Left: Calendar & Location -->
        <div class="lg:w-1/3">
            <h2 class="text-5xl font-display text-brand-navy mb-8">SELECT <span class="text-brand-orange">VENUE</span></h2>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-500 mb-2 uppercase">Location</label>
                <select id="locationSelect" class="w-full bg-white border-4 border-brand-navy text-brand-navy font-bold text-lg p-4 outline-none focus:border-brand-orange cursor-pointer transform skew-x-[-2deg]">
                    <option value="downtown">Downtown Arena (₹2000/hr)</option>
                    <option value="northside">Northside Pitch (₹1500/hr)</option>
                    <option value="eastside">Eastside Complex (₹1200/hr)</option>
                    <option value="westend">Westend Park (₹1800/hr)</option>
                    <option value="central">Central Stadium (₹2500/hr)</option>
                </select>
            </div>
            
            <div class="mb-8">
                <label class="block text-sm font-bold text-gray-500 mb-2 uppercase">Turf / Court</label>
                <select id="turfSelect" class="w-full bg-white border-4 border-brand-navy text-brand-navy font-bold text-lg p-4 outline-none focus:border-brand-orange cursor-pointer transform skew-x-[-2deg]">
                    <option value="multipurpose">Football / Cricket Turf (Multi-purpose)</option>
                    <option value="badminton_1">Badminton Court 1 (Indoor)</option>
                    <option value="badminton_2">Badminton Court 2 (Indoor)</option>
                </select>
            </div>

            <div class="bg-white border-4 border-gray-200 p-6 shadow-xl relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-brand-orange"></div>
                <div class="flex justify-between items-center mb-6">
                    <button id="prevMonth" class="text-brand-navy hover:text-brand-orange font-bold text-xl">&larr;</button>
                    <h3 id="monthYear" class="font-bold text-xl uppercase tracking-wider text-brand-navy"></h3>
                    <button id="nextMonth" class="text-brand-navy hover:text-brand-orange font-bold text-xl">&rarr;</button>
                </div>
                
                <div class="calendar-grid mb-2">
                    <div class="day-header">SUN</div><div class="day-header">MON</div><div class="day-header">TUE</div>
                    <div class="day-header">WED</div><div class="day-header">THU</div><div class="day-header">FRI</div><div class="day-header">SAT</div>
                </div>
                <div id="calendarDays" class="calendar-grid"></div>
            </div>
        </div>

        <!-- Right: Slots -->
        <div class="lg:w-2/3">
            <h2 class="text-5xl font-display text-brand-navy mb-8">AVAILABLE <span class="text-brand-orange">SLOTS</span></h2>
            
            <div id="loadingSlots" class="hidden text-center py-12 text-brand-orange text-3xl animate-pulse font-display">
                SYNCING DATA...
            </div>

            <div id="slotsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-gray-500 font-bold">Please select a date from the calendar.</div>
            </div>
        </div>
    </main>

    <!-- Booking Modal -->
    <div id="bookingModal" class="hidden fixed inset-0 bg-brand-navy bg-opacity-95 z-50 flex items-center justify-center p-4">
        <div class="bg-white border-t-8 border-brand-orange p-8 max-w-md w-full shadow-2xl relative">
            <h3 class="text-4xl font-display text-brand-navy mb-1">CONFIRM <span class="text-brand-orange">BOOKING</span></h3>
            <p class="text-gray-500 mb-6 font-bold"><span id="modalLoc"></span> - <span id="modalTurf"></span><br><span id="modalDateStr"></span> @ <span id="modalTime" class="text-brand-navy"></span></p>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase mb-1">Player Name</label>
                    <input type="text" id="custName" class="w-full bg-gray-100 border-2 border-gray-300 p-3 text-brand-navy font-bold focus:border-brand-orange outline-none transform skew-x-[-2deg]">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase mb-1">Phone Number (Required for cancellation)</label>
                    <input type="tel" id="custPhone" class="w-full bg-gray-100 border-2 border-gray-300 p-3 text-brand-navy font-bold focus:border-brand-orange outline-none transform skew-x-[-2deg]">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 uppercase mb-1">Payment Method</label>
                    <select id="paymentMethod" class="w-full bg-gray-100 border-2 border-gray-300 p-3 text-brand-navy font-bold focus:border-brand-orange outline-none transform skew-x-[-2deg]">
                        <option value="upi">UPI (GPay, PhonePe, Paytm)</option>
                        <option value="card">Credit / Debit Card</option>
                        <option value="cash">Cash at Venue</option>
                    </select>
                </div>
                <div class="flex justify-between items-center bg-gray-100 p-4 border-2 border-gray-300 transform skew-x-[-2deg]">
                    <span class="text-gray-600 font-bold uppercase">Total Price</span>
                    <span id="modalPrice" class="text-3xl font-display text-brand-orange"></span>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="closeModal('bookingModal')" class="flex-1 bg-gray-200 text-brand-navy font-display text-2xl py-3 transform skew-x-[-5deg]">CANCEL</button>
                <button id="confirmBtn" onclick="submitBooking()" class="flex-1 bg-brand-orange text-white font-display text-2xl py-3 transform skew-x-[-5deg]">PAY & BOOK</button>
            </div>
        </div>
    </div>

    <!-- Manage Bookings Modal -->
    <div id="manageModal" class="hidden fixed inset-0 bg-brand-navy bg-opacity-95 z-50 flex items-center justify-center p-4">
        <div class="bg-white border-t-8 border-brand-orange p-8 max-w-lg w-full shadow-2xl relative">
            <h3 class="text-4xl font-display text-brand-navy mb-4">MANAGE <span class="text-brand-orange">BOOKINGS</span></h3>
            
            <div class="flex gap-2 mb-6">
                <input type="tel" id="managePhone" placeholder="Enter Phone Number" class="flex-1 bg-gray-100 border-2 border-gray-300 p-3 text-brand-navy font-bold focus:border-brand-orange outline-none transform skew-x-[-2deg]">
                <button onclick="fetchMyBookings()" class="bg-brand-navy text-white px-6 font-display text-xl transform skew-x-[-2deg]">SEARCH</button>
            </div>

            <div id="myBookingsList" class="space-y-4 max-h-64 overflow-y-auto pr-2">
                <!-- Bookings populate here -->
            </div>

            <button onclick="closeModal('manageModal')" class="mt-6 w-full bg-gray-200 text-brand-navy font-display text-2xl py-3 transform skew-x-[-5deg]">CLOSE</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-[-100px] left-1/2 transform -translate-x-1/2 px-8 py-4 bg-brand-navy text-white font-display text-2xl tracking-widest shadow-2xl transition-all duration-300 z-[1000] border-l-8 border-brand-orange"></div>

    <script>
        // Calendar Logic
        const calendarDays = document.getElementById('calendarDays');
        let currentDate = new Date();
        let selectedDateStr = null;
        let selectedSlotObj = null;

        function renderCalendar() {
            calendarDays.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            document.getElementById('monthYear').textContent = currentDate.toLocaleDateString('default', { month: 'long', year: 'numeric' });
            const today = new Date(); today.setHours(0,0,0,0);

            for(let i = 0; i < firstDay; i++) {
                calendarDays.appendChild(document.createElement('div'));
            }

            for(let i = 1; i <= daysInMonth; i++) {
                const dateObj = new Date(year, month, i);
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                
                const div = document.createElement('div');
                div.className = 'day-cell';
                div.innerHTML = `<span>${i}</span>`;
                
                if (dateObj < today) {
                    div.classList.add('disabled');
                } else {
                    if(selectedDateStr === dateStr) div.classList.add('selected');
                    div.onclick = () => { selectedDateStr = dateStr; renderCalendar(); fetchSlots(); };
                }
                calendarDays.appendChild(div);
            }
        }

        document.getElementById('prevMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
        document.getElementById('nextMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };
        
        const t = new Date();
        selectedDateStr = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
        renderCalendar(); fetchSlots();
        
        document.getElementById('locationSelect').addEventListener('change', fetchSlots);
        document.getElementById('turfSelect').addEventListener('change', fetchSlots);

        // LocalStorage DB Implementation for GitHub Pages
        function getDB() { return JSON.parse(localStorage.getItem('turfx_bookings') || '[]'); }
        function saveDB(data) { localStorage.setItem('turfx_bookings', JSON.stringify(data)); }
        
        function getPriceForSlot(timeSlot, location) {
            const isPM = timeSlot.includes('PM');
            let hour = parseInt(timeSlot.split(':')[0]);
            if (isPM && hour !== 12) hour += 12;
            if (!isPM && hour === 12) hour = 0;
            const prices = { 'downtown': 2000, 'northside': 1500, 'eastside': 1200, 'westend': 1800, 'central': 2500 };
            return hour >= 17 ? (prices[location] || 1500) + 500 : (prices[location] || 1500);
        }

        async function fetchSlots() {
            if(!selectedDateStr) return;
            const loc = document.getElementById('locationSelect').value;
            const turf = document.getElementById('turfSelect').value;
            const container = document.getElementById('slotsContainer');
            const loader = document.getElementById('loadingSlots');
            
            container.innerHTML = ''; loader.classList.remove('hidden');

            // Simulate network delay for aesthetic loader
            setTimeout(() => {
                const allSlots = [
                    "9:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "1:00 PM", "2:00 PM",
                    "3:00 PM", "4:00 PM", "5:00 PM", "6:00 PM", "7:00 PM", "8:00 PM", "9:00 PM"
                ];
                const db = getDB();
                const bookedMap = {};
                db.filter(b => b.location === loc && b.turfId === turf && b.date === selectedDateStr)
                  .forEach(b => bookedMap[b.slot] = b.customerName);

                loader.classList.add('hidden');
                
                allSlots.forEach(time => {
                    const isBooked = !!bookedMap[time];
                    const price = getPriceForSlot(time, loc);
                    const el = document.createElement('div');
                    el.className = `slot-card border-4 p-5 bg-white ${isBooked ? 'border-gray-200 bg-gray-50 opacity-50' : 'border-brand-navy cursor-pointer hover:bg-brand-navy hover:text-white group'}`;
                    
                    if(isBooked) {
                        el.innerHTML = `
                            <div class="slot-card-inner flex justify-between items-center">
                                <span class="text-2xl font-display text-gray-400">${time}</span>
                                <span class="text-sm font-bold text-gray-500 bg-gray-200 px-2 py-1 uppercase">Booked</span>
                            </div>`;
                    } else {
                        el.onclick = () => openBookingModal({time, price});
                        el.innerHTML = `
                            <div class="slot-card-inner">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-2xl font-display text-brand-navy group-hover:text-white">${time}</span>
                                    <span class="text-xl font-display text-brand-orange">₹${price}</span>
                                </div>
                                <div class="text-sm font-bold text-gray-400 group-hover:text-brand-orange">SELECT SLOT &rarr;</div>
                            </div>`;
                    }
                    container.appendChild(el);
                });
            }, 300);
        }

        // Modals & Booking
        function openBookingModal(slot) {
            selectedSlotObj = slot;
            const locSel = document.getElementById('locationSelect');
            const turfSel = document.getElementById('turfSelect');
            document.getElementById('modalLoc').textContent = locSel.options[locSel.selectedIndex].text;
            document.getElementById('modalTurf').textContent = turfSel.options[turfSel.selectedIndex].text;
            document.getElementById('modalDateStr').textContent = selectedDateStr;
            document.getElementById('modalTime').textContent = slot.time;
            document.getElementById('modalPrice').textContent = `₹${slot.price}`;
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('bookingModal').classList.remove('hidden');
        }

        function openManageModal() {
            document.getElementById('manageModal').classList.remove('hidden');
            document.getElementById('myBookingsList').innerHTML = '<p class="text-gray-500 italic">Enter your phone number to find your bookings.</p>';
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function showToast(msg, isError=false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.bottom = '50px';
            toast.style.borderLeftColor = isError ? 'red' : '#ff5a00';
            setTimeout(() => toast.style.bottom = '-100px', 3000);
        }

        async function submitBooking() {
            const customerName = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const paymentMethod = document.getElementById('paymentMethod').value;
            const btn = document.getElementById('confirmBtn');

            if(!customerName || !phone) return showToast('Please enter name and phone', true);

            btn.textContent = 'WAIT...'; btn.disabled = true;

            setTimeout(() => {
                const db = getDB();
                const loc = document.getElementById('locationSelect').value;
                const turf = document.getElementById('turfSelect').value;
                
                // Check if already booked
                if(db.find(b => b.location === loc && b.turfId === turf && b.date === selectedDateStr && b.slot === selectedSlotObj.time)) {
                    showToast('Slot already booked!', true);
                    btn.textContent = 'PAY & BOOK'; btn.disabled = false;
                    return;
                }

                db.push({
                    id: Date.now(), // Generate unique ID
                    location: loc,
                    turfId: turf,
                    date: selectedDateStr,
                    slot: selectedSlotObj.time,
                    customerName, phone, paymentMethod,
                    price: selectedSlotObj.price
                });
                saveDB(db);

                showToast(`BOOKING CONFIRMED!`);
                closeModal('bookingModal'); 
                fetchSlots();
                btn.textContent = 'PAY & BOOK'; btn.disabled = false;
            }, 400);
        }

        async function fetchMyBookings() {
            const phone = document.getElementById('managePhone').value.trim();
            if(!phone) return;
            const list = document.getElementById('myBookingsList');
            list.innerHTML = '<p class="text-brand-orange animate-pulse font-bold">Searching...</p>';
            
            setTimeout(() => {
                const db = getDB();
                const bookings = db.filter(b => b.phone === phone).sort((a,b) => b.date.localeCompare(a.date));
                
                if(bookings.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 font-bold">No bookings found for this number.</p>';
                    return;
                }

                list.innerHTML = bookings.map(b => `
                    <div class="border-2 border-gray-200 p-4 bg-gray-50 flex justify-between items-center transform skew-x-[-2deg]">
                        <div>
                            <p class="font-display text-xl text-brand-navy">${b.date} @ ${b.slot}</p>
                            <p class="text-sm font-bold text-gray-500 uppercase">${b.location} - Pitch ${b.turfId} | ₹${b.price}</p>
                        </div>
                        <button onclick="cancelBooking(${b.id})" class="text-red-500 hover:text-red-700 font-bold uppercase underline">Cancel</button>
                    </div>
                `).join('');
            }, 300);
        }

        async function cancelBooking(id) {
            if(!confirm("Are you sure you want to cancel this booking?")) return;
            const db = getDB();
            const newDb = db.filter(b => b.id !== id);
            saveDB(newDb);
            showToast('Booking cancelled.');
            fetchMyBookings();
            fetchSlots();
        }

        // Initialize VanillaTilt for cards
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelectorAll(".card"), {
                    max: 5,
                    speed: 400
                });
            }
        });
    </script>
</body>
</html>
